<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>MeetFame progress loader preview</title>
    <style>
      html,
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      .logo-loader-screen {
        min-height: 100vh;
        min-height: 100dvh;
        background: #0a0f1d;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        padding: 24px;
      }
      .logo-loader-brand {
        display: block;
        width: 150px;
        height: auto;
        animation: logo-loader-pulse 2s ease-in-out infinite;
      }
      .logo-loader-track {
        position: relative;
        width: 150px;
        height: 3px;
        background: #263044;
        border-radius: 4px;
        overflow: hidden;
      }
      .logo-loader-track span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #6366f1, #b34ee0);
        animation: logo-loader-progress 1.4s ease-in-out infinite;
      }
      .logo-loader-screen p {
        font-size: 11px;
        color: #94a3b8;
        margin: 0;
      }
      @keyframes logo-loader-pulse {
        0%,
        100% {
          opacity: 0.65;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes logo-loader-progress {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-loader-brand {
          animation: none;
        }
        .logo-loader-track span {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="logo-loader-screen" role="status" aria-label="Loading MeetFame">
      <img
        class="logo-loader-brand"
        src="./public/branding/meetfame-logo.png"
        width="935"
        height="221"
        alt="MeetFame"
      />
      <div class="logo-loader-track" aria-hidden="true"><span></span></div>
      <p>Loading MeetFame…</p>
    </div>
  </body>
</html>
